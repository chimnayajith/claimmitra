name: Build ClaimMitra for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows desktop platform files
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package distributable folder
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          if (!(Test-Path "$release/claimmitra.exe")) {
            throw "Expected executable not found at $release/claimmitra.exe"
          }
          Compress-Archive -Path "$release/*" -DestinationPath "ClaimMitra-Windows-x64.zip" -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaimMitra-Windows-x64
          path: ClaimMitra-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
