name: Build ClaimMitra for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows desktop runner
        run: flutter create --platforms=windows .

      - name: Apply ClaimMitra branding
        shell: pwsh
        run: |
          $cmake = 'windows/CMakeLists.txt'
          (Get-Content $cmake -Raw).Replace(
            'set(BINARY_NAME "claimmitra")',
            'set(BINARY_NAME "ClaimMitra")'
          ) | Set-Content $cmake

          New-Item -ItemType Directory -Force `
            -Path 'windows/runner/resources' | Out-Null

          Copy-Item 'installer/claimmitra.ico' `
            'windows/runner/resources/app_icon.ico' -Force

          $mainCpp = 'windows/runner/main.cpp'
          if (Test-Path $mainCpp) {
            (Get-Content $mainCpp -Raw).Replace('L"claimmitra"', 'L"ClaimMitra"') |
              Set-Content $mainCpp
          }
          $rc = 'windows/runner/Runner.rc'
          if (Test-Path $rc) {
            $content = Get-Content $rc -Raw
            $content = $content -replace 'VALUE "FileDescription", ".*"', 'VALUE "FileDescription", "ClaimMitra - Insurance Claim Case Management"'
            $content = $content -replace 'VALUE "ProductName", ".*"', 'VALUE "ProductName", "ClaimMitra"'
            $content = $content -replace 'VALUE "InternalName", ".*"', 'VALUE "InternalName", "ClaimMitra"'
            $content = $content -replace 'VALUE "OriginalFilename", ".*"', 'VALUE "OriginalFilename", "ClaimMitra.exe"'
            Set-Content $rc $content
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LICENSE_PUBLIC_KEY_B64: ${{ secrets.LICENSE_PUBLIC_KEY_B64 }}
          APP_VERSION: 1.0.6
        run: |
          if (!$env:SUPABASE_URL -or !$env:SUPABASE_ANON_KEY -or !$env:LICENSE_PUBLIC_KEY_B64) {
            throw 'Missing licensing build secrets'
          }

          flutter build windows --release `
            "--dart-define=SUPABASE_URL=$env:SUPABASE_URL" `
            "--dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY" `
            "--dart-define=LICENSE_PUBLIC_KEY_B64=$env:LICENSE_PUBLIC_KEY_B64" `
            "--dart-define=APP_VERSION=$env:APP_VERSION"

      - name: Verify build output
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$release/ClaimMitra.exe")) {
            throw 'ClaimMitra.exe missing from build output'
          }
          if (!(Test-Path "$release/flutter_windows.dll")) {
            throw 'flutter_windows.dll missing from build output'
          }

      - name: Download and validate x64 Visual C++ Redistributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          & 'installer/Download-VCRedist.ps1'

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            'installer/ClaimMitra.iss'
          if ($LASTEXITCODE -ne 0) {
            throw 'Installer compilation failed'
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = 'dist/ClaimMitra-Setup-1.0.6.exe'
          if (!(Test-Path $installer)) {
            throw "Installer not found: $installer"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ClaimMitra-Windows-Installer
          path: dist/ClaimMitra-Setup-1.0.6.exe
          if-no-files-found: error
          retention-days: 30
