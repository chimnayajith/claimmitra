
name: Build ClaimMitra for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows desktop runner
        run: flutter create --platforms=windows .

      - name: Apply ClaimMitra Windows branding
        shell: pwsh
        run: |
          $cmake = 'windows/CMakeLists.txt'
          (Get-Content $cmake -Raw).Replace(
            'set(BINARY_NAME "claimmitra")',
            'set(BINARY_NAME "ClaimMitra")'
          ) | Set-Content $cmake

          New-Item -ItemType Directory -Force `
            -Path 'windows/runner/resources' | Out-Null

          Copy-Item 'installer/claimmitra.ico' `
            'windows/runner/resources/app_icon.ico' -Force

          $mainCpp = 'windows/runner/main.cpp'
          if (Test-Path $mainCpp) {
            (Get-Content $mainCpp -Raw).Replace(
              'L"claimmitra"', 'L"ClaimMitra"'
            ) | Set-Content $mainCpp
          }

          $rc = 'windows/runner/Runner.rc'
          if (Test-Path $rc) {
            $content = Get-Content $rc -Raw
            $content = $content -replace 'VALUE "FileDescription", ".*"', 'VALUE "FileDescription", "ClaimMitra - Insurance Claim Case Management"'
            $content = $content -replace 'VALUE "ProductName", ".*"', 'VALUE "ProductName", "ClaimMitra"'
            $content = $content -replace 'VALUE "InternalName", ".*"', 'VALUE "InternalName", "ClaimMitra"'
            $content = $content -replace 'VALUE "OriginalFilename", ".*"', 'VALUE "OriginalFilename", "ClaimMitra.exe"'
            Set-Content $rc $content
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build ClaimMitra installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "installer\ClaimMitra.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed"
          }

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath 'ClaimMitra-Portable-Windows-x64.zip' `
            -Force

      - name: Upload Windows releases
        uses: actions/upload-artifact@v4
        with:
          name: ClaimMitra-Windows-Release
          path: |
            installer/output/ClaimMitra-Setup-1.0.0.exe
            ClaimMitra-Portable-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
