name: claimmitra
description: ClaimMitra - Insurance claim case management.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.10.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^10.3.3
  excel: ^4.0.6
  http: ^1.4.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/claimmitra.png
    - assets/branding/claimmitra_icon.png
    - assets/branding/claimmitra_icon.svg
    - assets/branding/claimmitra_logo.svg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
